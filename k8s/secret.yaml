# Example Secret. Values below are placeholders, not real credentials.
# HF_TOKEN: leave empty for public Qwen/Qwen2.5-0.5B-Instruct.
#   For a gated model, put a Hugging Face token here and keep that edit out of git.
# API_KEY: Bearer token clients send as "Authorization: Bearer <API_KEY>".
#   Replace REPLACE_ME before applying this on a shared cluster.
apiVersion: v1
kind: Secret
metadata:
  name: safeboard-vllm
  labels:
    app: safeboard-vllm
type: Opaque
stringData:
  HF_TOKEN: ""
  API_KEY: "REPLACE_ME"
