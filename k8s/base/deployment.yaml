# Local images. Load both into Minikube before apply:
#   docker save safeboard-vllm:0.31 | minikube image load -
#   docker save safeboard-model-downloader:0.1 | minikube image load -
# initContainer download-model fills the PVC. The vLLM container only serves.
# Pod securityContext (uid/gid/fsGroup 1000, runAsNonRoot) applies to both.
# Recreate keeps the ReadWriteOnce model volume on a single pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: safeboard-vllm
  labels:
    app: safeboard-vllm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: safeboard-vllm
  template:
    metadata:
      labels:
        app: safeboard-vllm
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      initContainers:
        - name: download-model
          image: safeboard-model-downloader:0.1
          imagePullPolicy: Never
          command: ["/opt/safeboard/download_model.sh"]
          env:
            - name: MODEL_ID
              valueFrom:
                configMapKeyRef:
                  name: safeboard-vllm
                  key: MODEL_ID
            - name: MODEL_DIR
              valueFrom:
                configMapKeyRef:
                  name: safeboard-vllm
                  key: MODEL_DIR
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: safeboard-vllm
                  key: HF_TOKEN
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: vllm
          image: safeboard-vllm:0.31
          imagePullPolicy: Never
          command: ["/opt/safeboard/serve_model.sh"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: safeboard-vllm
            - secretRef:
                name: safeboard-vllm
          volumeMounts:
            - name: models
              mountPath: /models
            # vLLM workers need more than the default 64MiB /dev/shm (stage 2: --shm-size=1g).
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: safeboard-models
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
